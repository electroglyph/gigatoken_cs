[package]
name = "gigatoken-cabi"
version = "0.12.0"
edition = "2024"

[lib]
name = "gigatoken_cabi"
path = "cabi/lib.rs"
# cdylib for .NET P/Invoke; rlib so `cargo test --test …` integration tests
# can link the crate.
crate-type = ["cdylib", "rlib"]

[[test]]
name = "sp_model"
path = "cabi/tests/sp_model.rs"

[dependencies]
# Vendored upstream core (see cabi/lib.rs #[path] modules) minus pyo3/numpy.
dashmap = "6.1"
indicatif = "0.18"
itertools = "0.15"
priority-queue = "2.0"
rayon = "1.11"
rustc-hash = "2.1"
memmap2 = { version = "0.9", features = ["stable_deref_trait"] }
base64 = "0.22"
icu = { version = "2.2", features = ["compiled_data", "datagen"] }
eyre = "0.6.12"
sonic-rs = "0.5.8"
memchr = "2.8.0"
aho-corasick = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
zstd = "0.13"
spm_precompiled = "0.1.4"
simdutf = "0.7.0"
winnow = { version = "1", features = ["simd"] }
parquet = { version = "59.1.0", default-features = false, features = [
    "arrow",
    "snap",
    "zstd",
    "flate2",
    "lz4",
    "brotli",
    "flate2-rust_backend",
] }
arrow-array = "59"
arrow-schema = "59"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
libc = "0.2"
